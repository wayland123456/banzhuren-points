function collect(card){
  var o={};
  card.querySelectorAll('[data-f]').forEach(function(el){
    o[el.dataset.f] = el.value.trim();
  });
  return o;
}
var ADD_MAP={
  sched:function(v){ return {id:uid(),date:v.date,time:v.time||'08:00',title:v.title,type:v.type||'其他',done:false}; },
  homework:function(v){ return {id:uid(),subject:v.subject,title:v.title,due:v.due,
    assign:new Date().toISOString().slice(0,10),got:0,total:parseInt(v.total)||44}; },
  leave:function(v){ return {id:uid(),sid:v.sid,type:v.type,from:v.from,to:v.to,reason:v.reason,status:'待批准'}; },
  logs:function(v){ return {id:uid(),date:v.date,title:v.title,content:v.content}; },
  talks:function(v){ return {id:uid(),sid:v.sid,date:v.date,topic:v.topic,content:v.content}; },
  contact:function(v){ return {id:uid(),sid:v.sid,date:v.date,way:v.way,content:v.content}; },
  activities:function(v){ return {id:uid(),date:v.date,title:v.title,place:v.place,note:v.note}; },
  todos:function(v){ return {id:uid(),text:v.text,due:v.due,done:false}; }
};

document.addEventListener('click',function(ev){
  var el=ev.target.closest('button,[data-todo],[data-sdone],[data-seatid],[data-tt],[data-cday]');
  if(!el) return;
  var d=el.dataset;

  if(d.page){ setPage(d.page); closeSide(); return; }
  if(d.month!==undefined && d.month){ state.month=d.month; renderMenu(); renderHeader(); renderPage(); return; }
  if(d.ptab){ state.ptab=d.ptab; renderHeader(); renderPage(); return; }
  if(d.exam){ state.exam=d.exam; renderHeader(); renderPage(); return; }
  if(d.stab){ state.scoreTab=d.stab; renderHeader(); renderPage(); return; }
  if(d.gfilter!==undefined){ state.search=d.gfilter; renderHeader(); renderPage(); return; }

  if(d.item){ state.selItem=d.item; state.sel={}; renderPage(); return; }
  if(d.sid){
    if(state.sel[d.sid]) delete state.sel[d.sid]; else state.sel[d.sid]=1;
    el.classList.toggle('on');
    var sc=$('selCount'); if(sc) sc.textContent='已选 '+Object.keys(state.sel).length+' 人';
    updatePreview(); return;
  }
  if(d.gsel){
    DB.students.filter(function(s){return s.group===d.gsel}).forEach(function(s){state.sel[s.id]=1});
    renderPage(); return;
  }
  if(d.gnone){
    DB.students.filter(function(s){return s.group===d.gnone}).forEach(function(s){delete state.sel[s.id]});
    renderPage(); return;
  }
  if(d.all){ DB.students.forEach(function(s){state.sel[s.id]=1}); renderPage(); return; }
  if(d.none){ state.sel={}; renderPage(); return; }
  if(d.d){ var inp=$('inDelta'); if(inp){ inp.value=d.d; updatePreview(); } return; }

  if(d.del){
    DB.events=DB.events.filter(function(e){return e.id!==d.del});
    save(); renderMenu(); renderPage(); toast('已撤销'); return;
  }

  if(d.todo){
    var td=DB.todos.filter(function(x){return x.id===d.todo})[0];
    if(td){ td.done=!td.done; save(); renderMenu(); renderPage(); }
    return;
  }
  if(d.sdone){
    var sd=DB.sched.filter(function(x){return x.id===d.sdone})[0];
    if(sd){ sd.done=!sd.done; save(); renderMenu(); renderPage(); }
    return;
  }
  if(d.delSched){
    DB.sched=DB.sched.filter(function(x){return x.id!==d.delSched});
    save(); renderMenu(); renderPage(); return;
  }
  if(d.add){
    var card=el.closest('.card');
    var v=collect(card);
    if(d.add==='exam'){
      var subs=(v.subjects||'语文,数学,英语').split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean);
      DB.exams.push({id:'e'+Date.now(),name:v.name||'新考试',date:v.date,
        subjects:subs,full:subs.map(function(){return 150}),data:{}});
      save(); renderHeader(); renderPage(); toast('考试已创建'); return;
    }
    var fn=ADD_MAP[d.add];
    if(!fn) return;
    var obj=fn(v);
    var empty=false;
    Object.keys(obj).forEach(function(k){ if(obj[k]===''||obj[k]==null) empty=true; });
    if(empty){ toast('请填写完整信息'); return; }
    DB[d.add].push(obj);
    save(); renderMenu(); renderPage(); toast('已添加');
    return;
  }
  if(d.delp){
    var parts=d.delp.split(':');
    var st=parts[0], id=parts[1];
    DB[st]=DB[st].filter(function(x){return x.id!==id});
    save(); renderMenu(); renderPage(); toast('已删除'); return;
  }
  if(d.hw){
    var hw=DB.homework.filter(function(x){return x.id===d.hw})[0];
    if(hw && hw.got<hw.total){ hw.got++; save(); renderPage(); }
    return;
  }
  if(d.lv){
    var lv=DB.leave.filter(function(x){return x.id===d.lv})[0];
    if(lv){ lv.status='已批准'; save(); renderMenu(); renderPage(); toast('已批准'); }
    return;
  }
  if(d.cal!==undefined){
    var cm=state.calMonth, y=+cm.slice(0,4), mo=+cm.slice(5,7);
    if(d.cal==='0'){ var n=new Date(); state.calMonth=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
    else{ var dd=new Date(y,mo-1+ +d.cal,1); state.calMonth=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0'); }
    renderPage(); return;
  }
  if(d.cday){ toast(d.cday+' 的日程在下方列表中管理'); return; }
  if(d.tt){ openEdit('tt', d.tt); return; }
  if(d.seatid){
    var id2=d.seatid;
    if(state.seatSel && state.seatSel!==id2 && state.seatSel!==''){
      var a=state.seatSel, b=id2;
      GROUPS.forEach(function(g){
        var arr=DB.seats.order[g]||[];
        var ia=arr.indexOf(a), ib=arr.indexOf(b);
        if(ia>=0&&ib>=0){ arr[ia]=b; arr[ib]=a; }
        else if(ia>=0){ arr[ia]=b; var og=null; GROUPS.forEach(function(g2){
            if((DB.seats.order[g2]||[]).indexOf(b)>=0) og=g2; });
          if(og&&og!==g){ DB.seats.order[og]=(DB.seats.order[og]||[]).filter(function(x){return x!==b}); arr.push(a);
            arr[ia]=b; }
        }
      });
      state.seatSel=''; save(); renderPage(); toast('已交换座位');
    }else{
      state.seatSel=id2; renderPage();
    }
    return;
  }
  if(d.seat){
    if(d.seat==='reset'){
      DB.seats.order={};
      GROUPS.forEach(function(g){
        DB.seats.order[g]=DB.students.filter(function(s){return s.group===g}).map(function(s){return s.id});
      });
    }else if(d.seat==='rand'){
      GROUPS.forEach(function(g){
        var arr=(DB.seats.order[g]||[]).slice();
        for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
        DB.seats.order[g]=arr;
      });
    }else if(d.seat==='score'){
      var t=totals(state.month);
      GROUPS.forEach(function(g){
        DB.seats.order[g]=(DB.seats.order[g]||[]).slice().sort(function(a,b){return (t[b]||0)-(t[a]||0)});
      });
    }
    save(); renderPage(); toast('座位已更新'); return;
  }
  if(d.qbtn){
    if(d.qbtn==='rec'){ state.ptab='record'; setPage('points'); }
    if(d.qbtn==='todo'){ setPage('todos'); }
    if(d.qbtn==='talk'){ setPage('talks'); }
    if(d.qbtn==='sched'){ setPage('sched'); }
    if(d.qbtn==='contact'){ setPage('contact'); }
    if(d.qbtn==='log'){ setPage('logs'); }
    return;
  }
  if(d.srec){ state.sel={}; state.sel[d.srec]=1; state.ptab='record'; setPage('points'); return; }
  if(d.stalk){ setPage('talks'); return; }
  if(d.demo){
    var ex=DB.exams.filter(function(x){return x.id===state.exam})[0];
    if(ex){
      DB.students.forEach(function(s){
        ex.data[s.id]=[ +((104+24*Math.sin(s.no*1.63)+11*Math.cos(s.no*0.61)).toFixed(0)),
                        +((104+24*Math.sin(s.no*1.63+2.17)+11*Math.cos(s.no*0.61-1.3)).toFixed(0)),
                        +((104+22*Math.sin(s.no*1.4+4.3)+12*Math.cos(s.no*0.5-2.1)).toFixed(0)) ];
      });
      save(); renderPage(); toast('已载入示例成绩');
    }
    return;
  }
  if(d.saveScores){
    var ex2=DB.exams.filter(function(x){return x.id===state.exam})[0];
    document.querySelectorAll('[data-sc]').forEach(function(inp){
      var p=inp.dataset.sc.split(':');
      var sid=p[0], idx=+p[1];
      if(!ex2.data[sid]) ex2.data[sid]=[];
      ex2.data[sid][idx]= inp.value===''?null:parseInt(inp.value);
    });
    save(); renderPage(); toast('成绩已保存'); return;
  }
  if(d.export){ exportCSV(); return; }
});

document.addEventListener('input',function(ev){
  var inp=ev.target;
  if(inp.dataset && inp.dataset.sc){
    var sid=inp.dataset.sc.split(':')[0];
    var tr=inp.closest('tr');
    if(tr){
      var tot=0, ok=false;
      tr.querySelectorAll('[data-sc]').forEach(function(x){
        var v=parseInt(x.value); if(!isNaN(v)){ tot+=v; ok=true; }
      });
      var cell=tr.querySelector('[data-tot]');
      if(cell) cell.textContent = ok?tot:'—';
    }
  }
});

/* ================= 启动 ================= */
$('burger').onclick=function(){ $('side').classList.add('open'); $('mask').classList.add('on'); };
function closeSide(){ $('side').classList.remove('open'); $('mask').classList.remove('on'); }
$('mask').onclick=closeSide;
$('btnReset').onclick=function(){
  if(!confirm('将清空所有录入数据，恢复为初始演示数据。确定吗？')) return;
  DB=buildSeed(); save(); state.sel={}; state.seatSel=''; renderMenu(); renderHeader(); renderPage();
  toast('已恢复初始数据');
};

function clock(){
  var d=new Date();
  var w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  $('dDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+w;
  $('dTime').textContent=String(d.getHours()).padStart(2,'0')+':'+
    String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

state.seatSel='';
state.sel={};
DB=load();
if(!DB.version || DB.version<2){ DB=buildSeed(); save(); }
// 课表结构升级：旧的「5天×8节」自动迁移成动态网格
normalizeTT();
try{ localStorage.setItem('cm8_db',JSON.stringify(DB)); }catch(e){}
renderMenu();
renderHeader();
renderPage();
clock();
setInterval(clock,1000);
</script>

<script>
/* ================= 通用编辑弹层 ================= */
var SUBJ_OPTS = ['语文','数学','英语','物理','化学','生物','政治','体育','自习','班会'];

var EDT = {
  sched:{ title:'编辑日程', fields:[
    {k:'date',label:'日期',type:'date',w:'48%'},
    {k:'time',label:'时间',type:'time',w:'48%'},
    {k:'title',label:'事项',type:'text'},
    {k:'type',label:'类型',type:'select',options:['会议','教研','班会','教务','其他'],w:'48%'}
  ]},
  homework:{ title:'编辑作业', fields:[
    {k:'subject',label:'学科',type:'select',options:['语文','数学','英语','物理','化学','生物','政治'],w:'48%'},
    {k:'due',label:'截止日期',type:'date',w:'48%'},
    {k:'title',label:'作业内容',type:'text'},
    {k:'got',label:'已交人数',type:'number',w:'48%'},
    {k:'total',label:'应交人数',type:'number',w:'48%'}
  ]},
  leave:{ title:'编辑请假', fields:[
    {k:'sid',label:'学生',type:'stu',w:'48%'},
    {k:'type',label:'类型',type:'select',options:['病假','事假','公假'],w:'48%'},
    {k:'from',label:'开始',type:'text',w:'48%'},
    {k:'to',label:'结束',type:'text',w:'48%'},
    {k:'status',label:'状态',type:'select',options:['待批准','已批准','已驳回'],w:'48%'},
    {k:'reason',label:'事由',type:'text'}
  ]},
  logs:{ title:'编辑留痕', fields:[
    {k:'date',label:'日期',type:'date',w:'48%'},
    {k:'title',label:'事项',type:'text'},
    {k:'content',label:'内容',type:'textarea'}
  ]},
  talks:{ title:'编辑谈话记录', fields:[
    {k:'sid',label:'学生',type:'stu',w:'48%'},
    {k:'date',label:'日期',type:'date',w:'48%'},
    {k:'topic',label:'主题',type:'text'},
    {k:'content',label:'谈话内容',type:'textarea'}
  ]},
  contact:{ title:'编辑沟通记录', fields:[
    {k:'sid',label:'学生',type:'stu',w:'48%'},
    {k:'date',label:'日期',type:'date',w:'48%'},
    {k:'way',label:'方式',type:'select',options:['电话','微信','面谈','家访'],w:'48%'},
    {k:'content',label:'沟通内容',type:'textarea'}
  ]},
  activities:{ title:'编辑活动', fields:[
    {k:'date',label:'日期',type:'date',w:'48%'},
    {k:'place',label:'地点',type:'text',w:'48%'},
    {k:'title',label:'活动名称',type:'text'},
    {k:'note',label:'说明',type:'textarea'}
  ]},
  todos:{ title:'编辑待办', fields:[
    {k:'text',label:'内容',type:'text'},
    {k:'due',label:'截止',type:'text',w:'48%'}
  ]},
  students:{ title:'编辑学生', fields:[
    {k:'name',label:'姓名',type:'text',w:'48%'},
    {k:'group',label:'小组',type:'select',options:GROUPS.slice(),w:'48%'}
  ]},
  events:{ title:'编辑积分记录', fields:[
    {k:'date',label:'日期',type:'date',w:'48%'},
    {k:'delta',label:'分值',type:'number',w:'48%'},
    {k:'note',label:'事由',type:'text'}
  ]},
  items:{ title:'编辑积分项目', fields:[
    {k:'n',label:'项目名称',type:'text'},
    {k:'cat',label:'类别',type:'select',options:['学科','常规','学习','纪律','考试'],w:'48%'},
    {k:'d',label:'默认分值',type:'number',w:'48%'}
  ]},
  tt:{ title:'编辑课表', fields:[
    {k:'n',label:'科目（可自填）',type:'combo',options:SUBJ_OPTS,w:'48%'},
    {k:'c',label:'班级',type:'text',w:'48%'},
    {k:'room',label:'教室',type:'text',w:'48%'},
    {k:'r',label:'任课教师',type:'text',w:'48%'}
  ]},
  month:{ title:'新建月份', fields:[
    {k:'m',label:'月份',type:'month',w:'100%'}
  ]}
};

var EDITING = null;

function fieldHTML(f,val){
  var v = (val==null?'':String(val));
  var w = f.w || (f.type==='textarea' ? '100%' : '100%');
  var h='<div class="field" style="width:'+w+'"><label>'+esc(f.label)+'</label>';
  if(f.type==='textarea'){
    h+='<textarea data-f="'+f.k+'" style="min-height:88px">'+esc(v)+'</textarea>';
  }else if(f.type==='select'){
    h+='<select data-f="'+f.k+'">'+f.options.map(function(o){
      return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';
    }).join('')+'</select>';
  }else if(f.type==='combo'){
    h+='<input type="text" list="dl_'+f.k+'" data-f="'+f.k+'" value="'+esc(v)+'" placeholder="选一个或直接输入">';
    h+='<datalist id="dl_'+f.k+'">'+f.options.map(function(o){
      return '<option value="'+esc(o)+'">';
    }).join('')+'</datalist>';
  }else if(f.type==='stu'){
    h+='<select data-f="'+f.k+'">'+DB.students.map(function(s){
      return '<option value="'+s.id+'"'+(s.id===v?' selected':'')+'>'+esc(s.name)+'（'+s.group+'）</option>';
    }).join('')+'</select>';
  }else if(f.type==='number'){
    h+='<input type="number" data-f="'+f.k+'" value="'+esc(v)+'">';
  }else{
    h+='<input type="'+(f.type||'text')+'" data-f="'+f.k+'" value="'+esc(v)+'">';
  }
  return h+'</div>';
}

function getRecord(store,id){
  if(store==='tt'){
    var t=normalizeTT(), p=String(id).split('|');
    return (t.cells[p[0]+'|'+p[1]]) || {n:'',c:'',r:'',room:'',raw:''};
  }
  if(store==='students') return studentOf(id);
  if(store==='items') return ITEMS.filter(function(i){return i.id===id})[0];
  if(store==='events') return DB.events.filter(function(e){return e.id===id})[0];
  return (DB[store]||[]).filter(function(x){return x.id===id})[0];
}

function openEdit(store,id){
  var def=EDT[store];
  if(!def) return;
  var rec = id ? getRecord(store,id) : null;
  if(id && !rec){ toast('记录不存在'); return; }
  EDITING={store:store,id:id||null,def:def};
  $('mTitle').textContent = id ? def.title : '新增';
  $('mBody').innerHTML = def.fields.map(function(f){
    var val = rec ? rec[f.k] : (f.def!==undefined?f.def:'');
    return fieldHTML(f,val);
  }).join('');
  $('mDel').style.display = (id && store!=='month' && store!=='items') ? 'block' : 'none';
  $('modal').classList.add('on');
  var first=$('mBody').querySelector('input,select,textarea');
  if(first) setTimeout(function(){ first.focus(); },60);
}

function closeModal(){
  $('modal').classList.remove('on');
  EDITING=null;
}

function saveEdit(){
  var e=EDITING; if(!e) return;
  var conv={};
  e.def.fields.forEach(function(f){
    var el=$('mBody').querySelector('[data-f="'+f.k+'"]');
    if(!el) return;
    var v=el.value;
    if(f.type==='number'){ v=parseInt(v); if(isNaN(v)) v=0; }
    else v=String(v).trim();
    conv[f.k]=v;
  });

  if(e.store==='month'){
    var m=conv.m;
    if(!/^\d{4}-\d{2}$/.test(m)){ toast('请选择月份'); return; }
    if(MONTHS.indexOf(m)<0){
      MONTHS.push(m); MONTHS.sort();
      MLABEL[m]=(+m.slice(5))+'月';
    }
    state.month=m;
    closeModal(); renderMenu(); renderHeader(); renderPage();
    toast('已切换到 '+MLABEL[m]);
    return;
  }

  if(e.store==='tt'){
    var t2=normalizeTT(), p2=String(e.id).split('|'), key2=p2[0]+'|'+p2[1];
    var cell={n:conv.n||'',c:conv.c||'',r:conv.r||'',room:conv.room||''};
    cell.raw=[cell.n,cell.c,cell.room].filter(Boolean).join(' ');
    if(!cell.n && !cell.c) delete t2.cells[key2];
    else t2.cells[key2]=cell;
  }else if(e.store==='items'){
    var it=ITEMS.filter(function(i){return i.id===e.id})[0];
    if(it){ it.n=conv.n||it.n; it.cat=conv.cat||it.cat; it.d=conv.d; }
  }else if(e.store==='students'){
    if(!e.id){
      var maxNo=0;
      DB.students.forEach(function(s){ if(s.no>maxNo) maxNo=s.no; });
      DB.students.push({id:'s'+(maxNo+1),no:maxNo+1,name:conv.name||'新同学',
        group:conv.group||GROUPS[0],hand:{}});
    }else{
      var st=studentOf(e.id);
      if(st){ st.name=conv.name||st.name; st.group=conv.group||st.group; }
    }
  }else if(e.store==='events'){
    var ev=DB.events.filter(function(x){return x.id===e.id})[0];
    if(ev){
      ev.date=conv.date||ev.date;
      ev.delta=conv.delta;
      ev.note=conv.note;
      if(ev.date) ev.month=ev.date.slice(0,7);
    }
  }else{
    var rec=(DB[e.store]||[]).filter(function(x){return x.id===e.id})[0];
    if(rec){
      Object.keys(conv).forEach(function(k){ rec[k]=conv[k]; });
      if(e.store==='homework' && rec.total){
        if(rec.got>rec.total) rec.got=rec.total;
      }
    }
  }
  save(); closeModal(); renderMenu(); renderHeader(); renderPage(); toast('已保存');
}

function deleteEdit(){
  var e=EDITING; if(!e||!e.id) return;
  if(!confirm('确定删除这条记录？')) return;
  if(e.store==='students'){
    DB.students=DB.students.filter(function(s){return s.id!==e.id});
    DB.events=DB.events.filter(function(x){return x.sid!==e.id});
  }else if(e.store==='events'){
    DB.events=DB.events.filter(function(x){return x.id!==e.id});
  }else if(e.store==='tt'){
    var t3=normalizeTT(), p3=String(e.id).split('|');
    delete t3.cells[p3[0]+'|'+p3[1]];
  }else{
    DB[e.store]=(DB[e.store]||[]).filter(function(x){return x.id!==e.id});
  }
  save(); closeModal(); renderMenu(); renderHeader(); renderPage(); toast('已删除');
}

$('mSave').onclick=saveEdit;
$('mCancel').onclick=closeModal;
$('mClose').onclick=closeModal;
$('mDel').onclick=deleteEdit;
$('modal').onclick=function(ev){ if(ev.target===$('modal')) closeModal(); };
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape' && $('modal').classList.contains('on')) closeModal();
  if(ev.key==='Enter' && $('modal').classList.contains('on') && ev.target.tagName!=='TEXTAREA'){
    ev.preventDefault(); saveEdit();
  }
});

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-edit]');
  if(!el) return;
  var v=el.dataset.edit;
  var i=v.indexOf(':');
  openEdit(v.slice(0,i), v.slice(i+1));
});
</script>

</body>
</html>
