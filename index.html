<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2036">
<title>班主任工作台 · 高三（8）班</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#3b6ef5;--blue-d:#2a56d4;--purple:#8b5cf6;--green:#0eab7c;--orange:#f2942a;--red:#e3524b;
  --ink:#1f2a37;--ink2:#5b6878;--ink3:#93a1b3;--line:#edf0f5;--bg:#f4f6fb;--card:#fff;
  --side:#1b2036;--side2:#262d4a;--sel:#2f5cf0;--rad:14px;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

.shell{display:flex;min-height:100vh}

/* ---------- 侧边栏 ---------- */
.side{width:238px;flex:0 0 238px;background:linear-gradient(180deg,#1b2036 0%,#1a1f33 100%);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;
  border-right:1px solid rgba(255,255,255,.04)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 14px 14px 18px}
.blogo{width:35px;height:35px;border-radius:9px;background:linear-gradient(155deg,#9070f8,#6a4ce0);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;
  box-shadow:0 4px 12px rgba(120,90,240,.35)}
.btxt b{display:block;font-size:14.5px;color:#fff;font-weight:600;letter-spacing:.2px}
.btxt span{display:block;font-size:10px;color:#6d7893;letter-spacing:.9px;margin-top:1px}
.menu{flex:1;overflow-y:auto;padding:4px 10px 20px;scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.12) transparent}
.menu::-webkit-scrollbar{width:5px}
.menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;margin-bottom:2px;
  border:0;background:transparent;color:#c3cade;font-size:13.5px;font-family:inherit;cursor:pointer;
  border-radius:10px;text-align:left;position:relative;transition:.15s;line-height:1.3}
.mi:hover{background:rgba(255,255,255,.065);color:#fff}
.mi .em{font-size:17px;width:24px;flex:0 0 24px;text-align:center;line-height:1}
.mi .no{color:#6b7690;font-size:12.5px;min-width:19px;font-variant-numeric:tabular-nums;transition:.15s}
.mi .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.active{background:var(--sel);color:#fff;box-shadow:0 6px 16px rgba(47,92,240,.34)}
.mi.active .no{color:rgba(255,255,255,.62)}
.dot{background:#e8453c;color:#fff;font-size:11px;font-weight:600;min-width:19px;height:19px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex:0 0 auto}
.mi.active .dot{background:#fff;color:var(--sel)}
.newtag{font-size:9.5px;background:rgba(120,235,190,.16);color:#6fe0b6;padding:1px 5px;
  border-radius:4px;font-weight:600;letter-spacing:.3px}
.mi.active .newtag{background:rgba(255,255,255,.22);color:#fff}
.sidefoot{padding:10px 18px 16px;border-top:1px solid rgba(255,255,255,.06)}
.sidefoot button{width:100%;border:1px solid rgba(255,255,255,.1);background:transparent;
  color:#8b96ae;font-size:12px;padding:7px;border-radius:8px;cursor:pointer;font-family:inherit}
.sidefoot button:hover{color:#fff;border-color:rgba(255,255,255,.25)}

/* ---------- 主体 ---------- */
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{background:#fff;border-bottom:1px solid var(--line);padding:11px 20px 0;
  position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.burger{display:none;width:34px;height:34px;border-radius:9px;border:0;background:#f4f6fb;
  cursor:pointer;align-items:center;justify-content:center;color:#6b7688}
.cls{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.cls i{font-style:normal;color:#a9b4c4;font-size:11px;transform:translateY(1px)}
.clock{margin-left:auto;text-align:right;line-height:1.2}
.clock b{font-size:12.5px;color:var(--ink2);font-weight:500}
.clock em{display:block;font-style:normal;font-size:17px;font-weight:600;color:#2c3a4d;
  font-variant-numeric:tabular-nums;letter-spacing:.4px}
.ptitle{font-size:20px;font-weight:600;margin:11px 0 2px}
.psub{font-size:12.5px;color:var(--ink3)}
.chips{display:flex;gap:7px;padding:11px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.tight{padding-top:0;padding-bottom:12px}
.chip{border:1px solid #e3e8f0;background:#fff;color:#55637a;font-size:12.5px;padding:6px 14px;
  border-radius:18px;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit;
  display:flex;align-items:center;gap:5px}
.chip:hover{border-color:#c3d3f5;color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500;
  box-shadow:0 3px 9px rgba(59,110,245,.24)}
.chip.act.on{background:#fff;color:var(--blue);border-color:var(--blue);box-shadow:none;font-weight:600}
.chip .box{width:12px;height:12px;border-radius:3px;border:1.4px solid currentColor;
  display:inline-block;position:relative}
.chip.on .box{background:var(--blue);border-color:#fff}
.chip.on .box::after{content:"";position:absolute;left:3px;top:0.5px;width:4px;height:7px;
  border:1.4px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}

.wrap{padding:18px 20px 90px;max-width:1120px;width:100%}
.page{display:none}.page.on{display:block}

/* ---------- 通用卡片 ---------- */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{background:#fff;border-radius:var(--rad);padding:15px 16px;border:1px solid var(--line);
  position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0}
.metric.b::before{background:var(--blue)}.metric.g::before{background:var(--green)}
.metric.o::before{background:var(--orange)}.metric.p::before{background:var(--purple)}
.metric.r::before{background:var(--red)}
.mlabel{font-size:12.5px;color:var(--ink3);margin-bottom:7px}
.mval{font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.metric.b .mval{color:var(--blue)}.metric.g .mval{color:var(--green)}
.metric.o .mval{color:var(--orange)}.metric.p .mval{color:var(--purple)}.metric.r .mval{color:var(--red)}
.mval small{font-size:15px;font-weight:500;margin-left:1px}
.msub{font-size:11.5px;color:#aab5c4;margin-top:6px}

.card{background:#fff;border-radius:var(--rad);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:14.5px;font-weight:600}
.tag{font-size:11px;color:#98a5b6;background:#f4f6fb;padding:2px 7px;border-radius:5px}
.tag.warn{background:#fff6e6;color:#c07c14}
.rt{margin-left:auto;font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

svg{display:block;width:100%;overflow:visible}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:#8d9aab;font-size:12px;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f5f7fa;color:#37455a;white-space:nowrap}
tbody tr:hover{background:#f9fbfe}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  border-radius:7px;font-size:12px;font-weight:600;background:#f2f5fa;color:#7b8899;padding:0 4px}
.rk.t1{background:#fff5e0;color:#c98a17}.rk.t2{background:#f0f3f8;color:#7d8b9e}
.rk.t3{background:#fbeee4;color:#b9793f}
.up{color:#e3524b}.down{color:#0eab7c}.flat{color:#aab5c4}
.badge{display:inline-block;font-size:11px;padding:2px 6px;border-radius:5px;
  background:#fdecec;color:#c9433c;border:1px solid #f8d5d3}
.badge.ok{background:#e9f8f2;color:#0b8a63;border-color:#c9ecdf}
.badge.warn{background:#fff6e6;color:#b57a12;border-color:#f8e3bd}
.badge.info{background:#eef3ff;color:#2a56d4;border-color:#d5e2fb}
.gname{color:#93a1b3;font-size:12px}
.muted{color:#aab5c4}
.empty{text-align:center;color:#aab5c4;font-size:13px;padding:34px 0}
.hint{background:#fbfcfe;border:1px dashed #dfe6f0;border-radius:10px;padding:11px 13px;
  font-size:12.5px;color:#7b8899;line-height:1.65;margin-top:12px}
.hint b{color:#55637a}
.lib{display:flex;flex-wrap:wrap;gap:8px}
.lib .kv{background:#f7f9fd;border:1px solid #edf1f7;border-radius:8px;padding:7px 11px;
  font-size:12.5px;color:#55637a}
.lib .kv b{color:#37455a;font-weight:600}
.notice{background:#fff8ea;border:1px solid #f7e5c2;border-radius:10px;padding:10px 13px;
  font-size:12.5px;color:#a9772a;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.notice b{font-weight:600}

/* ---------- 表单 ---------- */
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:#98a5b6}
input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{
  border:1px solid #e3e8f0;border-radius:9px;padding:8px 11px;font-size:13.5px;font-family:inherit;
  color:#37455a;background:#fff;outline:none;transition:.15s;width:100%}
textarea{resize:vertical;min-height:62px;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,245,.1)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:13.5px;font-family:inherit;
  cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,110,245,.24)}
.btn.pri:hover{background:var(--blue-d)}
.btn.ghost{background:#f2f5fa;color:#55637a}
.btn.ghost:hover{background:#e8eef8}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.danger{background:#fdecec;color:#c9433c}
.btn.danger:hover{background:#fbdcdb}

.picker{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid #e3e8f0;background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;
  color:#55637a;cursor:pointer;transition:.13s;font-family:inherit;display:flex;align-items:center;gap:5px}
.pill:hover{border-color:#c3d3f5}
.pill.on{background:#eaf0ff;border-color:var(--blue);color:var(--blue-d);font-weight:500}
.pill.neg.on{background:#fdeeee;border-color:var(--red);color:#c9433c}
.pill b{font-weight:600;font-size:11px;opacity:.6}
.grpblock{margin-bottom:12px}
.grphead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.grphead b{font-size:12.5px;color:#6b7688;font-weight:500}
.grphead button{font-size:11.5px;border:0;background:#f2f5fa;color:#6b7688;padding:3px 8px;
  border-radius:6px;cursor:pointer;font-family:inherit}
.grphead button:hover{background:#e6ecf8;color:var(--blue)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.sbtn{border:1px solid #e6ebf3;background:#fff;border-radius:9px;padding:9px 4px;font-size:13px;
  color:#37455a;cursor:pointer;transition:.13s;font-family:inherit;text-align:center}
.sbtn:hover{border-color:#bcd0f7;background:#f7faff}
.sbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500;
  box-shadow:0 3px 8px rgba(59,110,245,.26)}
.sbtn .h{display:block;font-size:10.5px;color:#b3bdca;margin-top:1px}
.sbtn.on .h{color:rgba(255,255,255,.72)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs button{border:1px solid #e3e8f0;background:#fff;border-radius:7px;padding:5px 10px;
  font-size:12px;color:#6b7688;cursor:pointer;font-family:inherit}
.qs button:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- 小组 / 仪表盘 ---------- */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px 15px}
.gcard .t{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.gcard .t b{font-size:14px}
.gcard .t .rk{margin-left:auto}
.gstat{display:flex;gap:18px;margin-bottom:11px}
.gstat span{display:block;font-size:11px;color:#a3aebe}
.gstat strong{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.gbar{height:8px;border-radius:4px;background:#e9edf6;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5f8bff,#3b6ef5)}

.todo{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f5f7fa}
.todo:last-child{border-bottom:0}
.todo .ck{width:19px;height:19px;border-radius:6px;border:1.6px solid #ccd5e2;cursor:pointer;
  flex:0 0 19px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.todo.done .ck{background:var(--green);border-color:var(--green)}
.todo.done .tx{text-decoration:line-through;color:#b3bdca}
.todo .tx{flex:1;font-size:13px;color:#37455a}
.todo .tm{font-size:11.5px;color:#b3bdca}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.qbtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 10px;
  text-align:center;cursor:pointer;font-family:inherit;transition:.15s}
.qbtn:hover{border-color:#c3d3f5;background:#f9fbff;transform:translateY(-1px)}
.qbtn .qi{font-size:22px;display:block;margin-bottom:5px;line-height:1.2}
.qbtn .qn{font-size:12.5px;color:#55637a}

/* ---------- 日历 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cal .hcell{background:#fafbfe;padding:8px 4px;text-align:center;font-size:11.5px;color:#93a1b3}
.cal .cell{background:#fff;min-height:72px;padding:6px 7px;position:relative;cursor:pointer;transition:.13s}
.cal .cell:hover{background:#f7faff}
.cal .cell.out{background:#fcfdff;color:#d4dbe5}
.cal .cell.today{box-shadow:inset 0 0 0 1.6px var(--blue)}
.cal .d{font-size:12px;color:#55637a;font-weight:500}
.cal .cell.today .d{color:var(--blue);font-weight:600}
.cal .cell.out .d{color:#d4dbe5}
.cal .ev{font-size:10.5px;background:#eef3ff;color:#2a56d4;border-radius:4px;padding:1px 4px;
  margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.r{background:#fdecec;color:#c9433c}
.cal .ev.g{background:#e9f8f2;color:#0b8a63}

/* ---------- 课表 ---------- */
.tt{display:grid;grid-template-columns:54px repeat(5,1fr);gap:6px}
.tt .hh{font-size:11.5px;color:#93a1b3;text-align:center;padding:6px 0}
.tt .slot{background:#fafbfe;border-radius:8px;padding:8px 4px;text-align:center;font-size:11.5px;color:#93a1b3}
.tt .cls{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 5px;
  text-align:center;font-size:12.5px;color:#37455a;min-height:52px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.13s}
.tt .cls:hover{border-color:#c3d3f5;background:#f9fbff}
.tt .cls b{font-weight:500;font-size:12.5px}
.tt .cls span{font-size:10.5px;color:#a3aebe}

/* ---------- 课表 v3：动态网格 + 拍照识别 ---------- */
.ttbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.ttbar .grow{flex:1;min-width:170px;font-size:12px;color:#93a1b3;line-height:1.6}
.ttbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;color:#37455a;transition:.13s;font-family:inherit}
.ttbtn:hover{border-color:#bcd0f7;background:#f7faff}
.ttbtn:disabled{opacity:.55;cursor:default}
.ttbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.ttbtn.pri:hover{background:#2f5fe0}
.ttscroll{overflow-x:auto;padding-bottom:5px}
.tt2{display:grid;gap:6px}
.tt2 .hh{font-size:11.5px;color:#93a1b3;text-align:center;padding:7px 0;background:#fafbfe;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:500}
.tt2 .slot{background:#fafbfe;border-radius:8px;padding:6px 3px;text-align:center;font-size:11.5px;
  color:#93a1b3;display:flex;align-items:center;justify-content:center;line-height:1.3}
.tt2 .cls{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 4px;
  text-align:center;font-size:12.5px;color:#37455a;min-height:50px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.13s}
.tt2 .cls:hover{border-color:#c3d3f5;background:#f9fbff}
.tt2 .cls b{font-weight:500;font-size:12.5px}
.tt2 .cls span{font-size:10.5px;color:#a3aebe}
.tt2 .cls.empty b{color:#d3dae6;font-weight:400}
.ttnote{margin-top:12px;font-size:12px;color:#93a1b3;line-height:1.8}
.ttnote a{color:var(--blue);cursor:pointer;text-decoration:none}
.ttthumb{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:#93a1b3}
.ttthumb img{height:64px;border-radius:8px;border:1px solid var(--line);cursor:pointer}

/* 校对全屏层 */
.calib{position:fixed;inset:0;background:rgba(17,22,38,.62);z-index:500;display:none;padding:16px}
.calib.on{display:flex;align-items:center;justify-content:center}
.cbox{background:#fff;border-radius:16px;width:100%;max-width:1200px;min-width:0;height:92vh;display:flex;
  flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.cbar{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cbar h3{font-size:15px;font-weight:600}
.cbar .st{font-size:12px;color:#8b98aa;max-width:100%}
.cbar .sp{flex:1}
.cmain{flex:1;display:flex;min-height:0}
.cimg{width:42%;min-width:230px;background:#eef1f7;display:flex;align-items:center;justify-content:center;
  padding:12px;overflow:auto}
.cimg img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.13);cursor:zoom-in}
.cimg img.zoom{max-width:none;max-height:none;cursor:zoom-out}
.cimg .ph{color:#93a1b3;font-size:13px;text-align:center;line-height:1.9;padding:20px}
.cgrid{flex:1;padding:12px;overflow:auto;min-width:0}
.cin{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 4px;font-size:12px;
  text-align:center;color:#37455a;background:#fff;font-family:inherit;min-height:42px}
.cin:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,245,.12)}
.cin.ai{background:#fffbeb;border-color:#f2dda0}
.cin.hd{font-size:11px;color:#7b8899;background:#f7f9fd;border-color:transparent;padding:5px 3px;min-height:32px}
.cellw{position:relative}
.chd{display:flex;align-items:center;gap:1px}
.chd .cx{border:0;background:transparent;color:#c8d0dd;cursor:pointer;font-size:13px;line-height:1;
  padding:2px 4px;border-radius:6px}
.chd .cx:hover{color:#e3524b;background:#fdecec}
.cfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cfoot .sp{flex:1}

.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.mf .left{margin-right:auto}
.del{background:#fdecec;color:#c9433c}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#1f2a37;color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;

.mask{position:fixed;inset:0;background:rgba(17,22,38,.45);z-index:55;display:none}
.mask.on{display:block}

function totals(month){
  var m={}; DB.students.forEach(function(s){m[s.id]=0});
  DB.events.forEach(function(e){ if(e.month===month && m[e.sid]!==undefined) m[e.sid]+=e.delta; });
  return m;
}
function itemSums(month){
  var o={}; ITEMS.forEach(function(i){o[i.id]=0});
  DB.events.forEach(function(e){ if(e.month===month && o[e.item]!==undefined) o[e.item]+=e.delta; });
  return o;
}
function groupStats(month){
  var t=totals(month), g={};
  GROUPS.forEach(function(n){g[n]={name:n,total:0,cnt:0,avg:0}});
  DB.students.forEach(function(s){
    var v=t[s.id]||0, b=g[s.group]; if(!b)return;
    b.total+=v; b.cnt++;
  });
  Object.keys(g).forEach(function(k){ g[k].avg = g[k].cnt? g[k].total/g[k].cnt : 0; });
  return g;
}
function sumMonth(month){ var t=totals(month), s=0; for(var k in t) s+=t[k]; return s; }

/* ================= 图表 ================= */
function vbar(el,rows,opt){
  opt=opt||{};
  var W=Math.max(320, el.clientWidth||560), H=opt.h||196, pad={t:24,r:8,b:34,l:8};
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var max=Math.max.apply(null,rows.map(function(r){return Math.abs(r.v)}).concat([1]));
  var bw=Math.min(60, iw/rows.length*0.62);
  var s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  [0,.25,.5,.75,1].forEach(function(f){
    var y=pad.t+ih*(1-f);
    s+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#f1f4f9" stroke-width="1"/>';
  });
  rows.forEach(function(r,i){
    var cx=pad.l+iw/rows.length*(i+.5);
    var h=Math.max(2, Math.abs(r.v)/max*ih);
    var y=pad.t+ih-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="'+(bw/2.6)+'" fill="'+r.c+'"/>';
    s+='<text x="'+cx+'" y="'+(y-7)+'" text-anchor="middle" fill="'+r.c+'" font-size="11.5" font-weight="600">'+r.v+'</text>';
    s+='<text x="'+cx+'" y="'+(H-14)+'" text-anchor="middle" fill="#a3aebe" font-size="11">'+esc(r.n)+'</text>';
  });
  s+='</svg>';
  el.innerHTML=s;
}
function hbar(el,rows,opt){
  opt=opt||{};
  var W=Math.max(320, el.clientWidth||620), rowH=34, H=rows.length*rowH+10, lw=opt.lw||68;
  var max=Math.max.apply(null,rows.map(function(r){return Math.abs(r.v)}).concat([1]));
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  rows.forEach(function(r,i){
    var y=i*rowH+6, bw=(W-lw-56);
    var w=Math.max(3, Math.abs(r.v)/max*bw);
    s+='<text x="0" y="'+(y+13)+'" fill="#6b7688" font-size="12">'+esc(r.n)+'</text>';
    s+='<rect x="'+lw+'" y="'+(y+2)+'" width="'+bw+'" height="18" rx="9" fill="#f4f6fb"/>';
    s+='<rect x="'+lw+'" y="'+(y+2)+'" width="'+w+'" height="18" rx="9" fill="'+(r.c||'#3b6ef5')+'"/>';
    s+='<text x="'+(W-4)+'" y="'+(y+15)+'" text-anchor="end" fill="#55637a" font-size="12" font-weight="600">'+r.v+'</text>';
  });
  s+='</svg>'; el.innerHTML=s;
}
function lineChart(el,pts){
  var W=Math.max(320, el.clientWidth||620),H=180,pad={t:26,r:18,b:26,l:16};
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var mx=Math.max.apply(null,pts.map(function(p){return p.v})), mn=Math.min.apply(null,pts.map(function(p){return p.v}));
  var top=mx*1.12, bot=Math.min(0,mn*0.9);
  var X=function(i){return pad.l+iw*(pts.length===1?0.5:i/(pts.length-1))};
  var Y=function(v){return pad.t+ih*(1-(v-bot)/((top-bot)||1))};
  var s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+X(0)+'" y1="'+Y(bot)+'" x2="'+X(pts.length-1)+'" y2="'+Y(bot)+'" stroke="#f1f4f9" stroke-width="1"/>';
  var d='';
  pts.forEach(function(p,i){ d+=(i?' L':'M')+X(i)+' '+Y(p.v); });
  s+='<path d="'+d+' L'+X(pts.length-1)+' '+Y(bot)+' L'+X(0)+' '+Y(bot)+' Z" fill="rgba(59,110,245,.07)" stroke="none"/>';
  s+='<path d="'+d+'" fill="none" stroke="#3b6ef5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4.5" fill="#fff" stroke="#3b6ef5" stroke-width="2.4"/>';
    s+='<text x="'+X(i)+'" y="'+(Y(p.v)-13)+'" text-anchor="middle" fill="#3b6ef5" font-size="12" font-weight="600">'+p.v+'</text>';
    s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" fill="#a3aebe" font-size="11">'+p.n+'</text>';
  });
  s+='</svg>'; el.innerHTML=s;
}
function donut(el,parts,center){
  var total=parts.reduce(function(a,b){return a+b.v},0)||1;
  var R=54, r=36, cx=64, cy=64, ang=-Math.PI/2, s='<svg viewBox="0 0 128 128" style="width:128px">';
  parts.forEach(function(p){
    var a2=ang + p.v/total*Math.PI*2;
    var x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    var x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang);
    var laf=(a2-ang)>Math.PI?1:0;
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+laf+' 1 '+x2+' '+y2+' L'+x3+' '+y3+
       ' A'+r+' '+r+' 0 '+laf+' 0 '+x4+' '+y4+' Z" fill="'+p.c+'"/>';
    ang=a2;
  });
  s+='<text x="64" y="60" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2a37">'+(center||'')+'</text>';
  s+='</svg>';
  el.innerHTML=s;
}

function tbl(cols,rows){
  if(!rows.length) return '<div class="empty">暂无记录</div>';
  var h='<table><thead><tr>';
  cols.forEach(function(c){ h+='<th class="'+(c.num?'num':'')+'">'+c.label+'</th>'; });
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>';
    cols.forEach(function(c){
      var v = typeof c.fmt==='function' ? c.fmt(r) : (r[c.k]==null?'':r[c.k]);
      h+='<td class="'+(c.num?'num':'')+(c.cls?' '+c.cls:'')+'">'+v+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

/* ---- 时段排序：早自习 → 第1..9节 → 限时训练 → 晚自习 ---- */
function ttSlotRank(s){
  s=String(s||'');
  if(/早自习|早读|晨读/.test(s)) return 0;
  var m=s.match(/第\s*(\d{1,2})\s*节/);
  if(m) return 10+parseInt(m[1],10);
  if(/限时|午练|午自习|午休/.test(s)) return 35;
  if(/晚自习|晚修|晚辅/.test(s)){ var k=s.match(/(\d)/); return 40+(k?parseInt(k[1],10):1); }
  return 25;
}
function ttSortSlots(arr){
  return arr.slice().sort(function(a,b){
    var d=ttSlotRank(a)-ttSlotRank(b);
    return d||String(a).localeCompare(String(b),'zh');
  });
}

/* ---- 单元格文本 → 结构化（科目 / 班级 / 教室） ---- */
function ttParseCell(raw){
  var s=String(raw==null?'':raw).replace(/\s+/g,' ').trim();
  if(!s) return null;
  if(/^[-—─/\\·.]+$/.test(s)) return null;
  if(/^(无|空|休息|放假|—)$/.test(s)) return null;
  var cls='';
  var cm=s.match(/高?[一二三]?\s*[（(]?\s*(\d{1,2})\s*[）)]?\s*班/);
  if(cm) cls=cm[1]+'班';
  var sub='';
  for(var i=0;i<TT_SUBJECTS.length;i++){
    if(s.indexOf(TT_SUBJECTS[i])>=0){ sub=TT_SUBJECTS[i]; break; }
  }
  if(!sub){
    var t2=s.replace(/高?[一二三]?\s*[（(]?\s*\d{1,2}\s*[）)]?\s*班/g,' ').trim();
    sub=(t2.split(/[\s\/·,，、]+/).filter(Boolean)[0])||s;
  }
  return {n:sub,c:cls,r:'',room:'',raw:s};
}

/* ---- 数据规范化：兼容旧的 5天×8节 结构 ---- */
function normalizeTT(){
  var t=DB.tt;
  if(t && Object.prototype.toString.call(t.days)==='[object Array]' &&
     Object.prototype.toString.call(t.slots)==='[object Array]' &&
     t.cells && typeof t.cells==='object') return t;
  var days=['周一','周二','周三','周四','周五'];
  var slots=['第1节','第2节','第3节','第4节','第5节','第6节','第7节','第8节'];
  var cells={};
  if(t && typeof t==='object'){
    Object.keys(t).forEach(function(dk){
      if(!/^\d+$/.test(dk)) return;
      var arr=t[dk]; if(!arr||!arr.length) return;
      arr.forEach(function(c,i){
        if(!c||!c.n) return;
        cells[dk+'|'+i]={n:c.n,c:'',r:c.r||'',room:c.room||'',
          raw:c.n+(c.r?' '+c.r:'')};
      });
    });
  }
  DB.tt={days:days,slots:slots,cells:cells,meta:{src:'legacy',at:Date.now()}};
  return DB.tt;
}

/* ---- 按名称重排（加/删行时保住已有内容） ---- */
function ttReshape(t,newDays,newSlots){
  var byName={};
  t.days.forEach(function(dn,di){
    t.slots.forEach(function(sn,si){
      var c=t.cells[di+'|'+si];
      if(c) byName[dn+'||'+sn]=c;
    });
  });
  var cells={};
  newDays.forEach(function(dn,di){
    newSlots.forEach(function(sn,si){
      var c=byName[dn+'||'+sn];
      if(c) cells[di+'|'+si]=c;
    });
  });
  t.days=newDays; t.slots=newSlots; t.cells=cells;
  return t;
}

/* ---- 示例课表：按真实高三英语课表（早自习/9节/限时/晚自习） ---- */
function ttSeed(){
  var days=['周一','周二','周三','周四','周五','周六','周日'];
  var slots=['早自习','第1节','第2节','第3节','第4节','第5节','限时训练',
             '第6节','第7节','第8节','第9节','晚自习1','晚自习2'];

    '早自习':{'周一':'英语 18班','周二':'英语 1班','周四':'英语 1班','周五':'英语 18班'},
    '第1节':{'周一':'英语 1班','周二':'英语 1班','周五':'英语 18班','周日':'英语 1班'},
    '第2节':{'周三':'英语 1班','周五':'英语 1班','周日':'英语 1班'},
    '第3节':{'周二':'英语 18班','周三':'英语 1班','周四':'英语 1班','周日':'英语 18班'},
    '第4节':{'周二':'英语 18班','周三':'英语 18班','周四':'英语 18班','周日':'英语 18班'},
    '第5节':{'周四':'英语 18班','周日':'英语 18班'},
    '限时训练':{'周二':'英语 1班','周四':'英语 1班'},
    '第6节':{'周四':'英语 1班','周日':'英语 1班'},
    '第9节':{'周一':'英语 18班'},
    '晚自习1':{'周二':'英语 18班','周五':'英语 1班'},
    '晚自习2':{'周二':'英语 1班','周五':'英语 18班'}
  };
  var cells={};
  days.forEach(function(d,di){
    slots.forEach(function(s,si){
      var v=raw[s]&&raw[s][d];

function ttShrink(file,maxSide,quality,cb){
  var fr=new FileReader();

    var img=new Image();
    img.onerror=function(){ cb(null); };
    img.onload=function(){
      try{
        var s=Math.min(1,maxSide/Math.max(img.width,img.height));
        var cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*s));
        cv.height=Math.max(1,Math.round(img.height*s));
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.drawImage(img,0,0,cv.width,cv.height);
        cb({url:cv.toDataURL('image/jpeg',quality),w:cv.width,h:cv.height});
      }catch(e){ cb(null); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---- 课表识别提示词（用「逐格坐标」而不是二维数组，避免模型错位一格） ---- */
var TT_PROMPT=[
  '这是一张学校课表的照片（可能是教师课表或班级课表）。请把表格内容读成结构化数据，只输出 JSON。',
  '输出格式：',
  '{"days":["从左到右的星期表头"],"slots":["从上到下的节次表头"],',
  ' "entries":[{"day":"周一","slot":"第1节","text":"英语18班"}]}',
  '硬性要求：',
  '1. days 只放星期（如「周一」「星期二」，统一写成周一~周日）；slots 只放节次（如「早自习」「第1节」「限时训练」「晚自习1」）。',
  '2. 表头本身不要当成格子内容；左上角那个空格直接忽略。',
  '3. entries 只列「有内容的格子」，一格一条；day 和 slot 必须和 days / slots 里的写法完全一致。',
  '4. text 按图片原样照抄，例如「英语18班」「数学 高三(3)班」；格子内有多行就合并成一行，用空格隔开。',
  '5. 一个格子里有多条信息也不要拆成多条 entries。',
  '6. 看不清的格子直接不要列，绝对不要猜。',
  '7. 只输出 JSON 本身，不要任何解释文字。'
].join('\n');

/* ---- 从模型回复里抠 JSON ---- */
function ttExtractJson(txt){
  var s=String(txt||'').replace(/```json/gi,'```').replace(/```/g,'').trim();
  var a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<=a) throw new Error('未取到 JSON');
  var body=s.slice(a,b+1);
  try{ return JSON.parse(body); }catch(e){}
  return JSON.parse(body.replace(/,\s*([}\]])/g,'$1'));
}

function ttAiCall(model,dataUrl){
  var body={model:model,messages:[{role:'user',content:[
    {type:'text',text:TT_PROMPT},
    {type:'image_url',image_url:{url:dataUrl}}
  ]}]};
  return fetch(AI_PROXY,{
    method:'POST',
    headers:{'apikey':AI_PKEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){
    return r.text().then(function(txt){
      if(!r.ok) throw new Error('HTTP '+r.status);
      var j;
      try{ j=JSON.parse(txt); }catch(e){ throw new Error('返回内容非 JSON'); }
      if(j.error) throw new Error(j.error);
      var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      return ttExtractJson(c||'');
    });
  });
}
function ttAiParse(dataUrl){
  var chain=['qwen3.8-flash','qwen3.7-plus'];
  function go(i){
    if(i>=chain.length) return Promise.reject(new Error('识别服务暂不可用'));
    return ttAiCall(chain[i],dataUrl).catch(function(e){
      if(i+1>=chain.length) throw e;
      return go(i+1);
    });
  }
  return go(0);
}

/* ---- 解析结果归一化 ---- */
function ttNormDay(s){
  var t=String(s==null?'':s).replace(/\s+/g,'');
  var m=t.match(/(?:周|星期|礼拜)[一二三四五六日天]/);
  if(m) return m[0].replace('星期','周').replace('礼拜','周').replace('周天','周日');
  if(/^\d{1,2}$/.test(t)){
    var i=parseInt(t,10);
    if(i>=1&&i<=7) return '周'+'一二三四五六日'.charAt(i-1);
  }
  return t;
}
function ttDayRank(s){
  var i=TT_DAYS_ALL.indexOf(s);
  return i<0?99:i;
}
function ttSortDays(arr){
  return arr.slice().sort(function(a,b){ return ttDayRank(a)-ttDayRank(b); });
}
function ttNum(g){
  if(/^\d+$/.test(g)) return parseInt(g,10);
  var CN={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  if(g==='十') return 10;
  if(/^十[一二三四五六七八九]$/.test(g)) return 10+CN[g.charAt(1)];
  if(/^[一二三四五六七八九]十$/.test(g)) return CN[g.charAt(0)]*10;
  if(/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(g))
    return CN[g.charAt(0)]*10+CN[g.charAt(2)];
  return CN[g]||0;
}
function ttNormSlot(s){
  var t=String(s==null?'':s).replace(/\s+/g,'').replace(/[（(]/g,'').replace(/[）)]/g,'');
  var m=t.match(/第?([一二三四五六七八九十]+|\d{1,2})\s*节/);
  if(m){ var n=ttNum(m[1]); if(n) return '第'+n+'节'; }
  if(/早/.test(t)&&/自习|读/.test(t)) return '早自习';
  if(/限时|午练/.test(t)) return '限时训练';
  if(/晚/.test(t)&&/自习|修|辅/.test(t)){
    var k=t.match(/([一二三四五六七八九十]|\d)/);
    var n2=k?ttNum(k[1]):0;
    return '晚自习'+(n2||1);
  }
  return t;
}
function ttNormalizeParsed(o){
  o=o||{};
  var rd=o.days||o.Days||o.week||o.weekdays||[];
  var rs=o.slots||o.Slots||o.periods||o.times||[];
  var entries=o.entries||o.Entries||o.list||o.items||null;
  if(Object.prototype.toString.call(rd)!=='[object Array]') rd=[];
  if(Object.prototype.toString.call(rs)!=='[object Array]') rs=[];
  var ok=function(x){ return x && !/^[-—─]+$/.test(x); };

  /* ---- 主路径：逐格坐标列表（不会错位） ---- */
  if(Object.prototype.toString.call(entries)==='[object Array]' && entries.length){
    var days=rd.map(ttNormDay).filter(ok);
    var slots=rs.map(ttNormSlot).filter(ok);
    days=days.filter(function(x,i){ return days.indexOf(x)===i; });
    slots=slots.filter(function(x,i){ return slots.indexOf(x)===i; });
    var clean=entries.map(function(e){
      e=e||{};
      var dn=ttNormDay(e.day||e.d||e.week||e.col||'');
      var sn=ttNormSlot(e.slot||e.s||e.period||e.row||e['节次']||'');
      var txt=String(e.text||e.content||e.value||e.cell||e['内容']||'').replace(/\s+/g,' ').trim();
      return {d:dn,s:sn,t:txt};
    }).filter(function(e){ return e.d && e.s && e.t; });
    clean.forEach(function(e){
      if(days.indexOf(e.d)<0) days.push(e.d);
      if(slots.indexOf(e.s)<0) slots.push(e.s);
    });
    if(!days.length) days=TT_DAYS_ALL.slice(0,5);
    if(!slots.length) slots=TT_SLOT_BASE.slice(1,9);
    days=ttSortDays(days);
    slots=ttSortSlots(slots);
    var cells={}, bad2=0;
    clean.forEach(function(e){
      var di=days.indexOf(e.d), si=slots.indexOf(e.s);
      if(di<0||si<0) return;
      if(!ttParseCell(e.t)){ bad2++; return; }
      var k=di+'|'+si;
      cells[k]=cells[k]?(cells[k]+' '+e.t):e.t;
    });
    return {days:days,slots:slots,cells:cells};
  }

  /* ---- 回退：二维数组网格 ---- */
  var grid=o.cells||o.Cells||o.grid||o.table||o.rows||[];
  if(Object.prototype.toString.call(grid)!=='[object Array]') grid=[];
  grid=grid.map(function(r){ return Object.prototype.toString.call(r)==='[object Array]'?r:[]; });

  var blank=function(v){ return !String(v==null?'':v).trim(); };
  // 表头首行全空 → 是模型多留的一行
  if(grid.length && grid[0].every(blank)) grid=grid.slice(1);

  var days2=rd.map(ttNormDay).filter(ok);
  var slots2=rs.map(ttNormSlot).filter(ok);
  days2=days2.filter(function(x,i){ return days2.indexOf(x)===i; });
  slots2=slots2.filter(function(x,i){ return slots2.indexOf(x)===i; });

  // 首列全空且列数比星期表头多一列 → 多留了一列表头
  var wMax=0; grid.forEach(function(r){ if(r.length>wMax) wMax=r.length; });
  if(grid.length && days2.length && wMax===days2.length+1 &&
     grid.every(function(r){ return blank(r[0]); })){
    grid=grid.map(function(r){ return r.slice(1); });
    wMax--;
  }

  if(!days2.length){
    days2=TT_DAYS_ALL.slice(0,Math.min(7,Math.max(1,wMax||5)));
  }
  while(days2.length<wMax) days2.push(TT_DAYS_ALL[days2.length]||('第'+(days2.length+1)+'天'));
  if(!slots2.length){
    for(var i2=0;i2<(grid.length||8);i2++) slots2.push('第'+(i2+1)+'节');
  }
  while(slots2.length<grid.length) slots2.push('第'+(slots2.length+1)+'节');

  var pairs=slots2.map(function(sn,i){ return {sn:sn,row:grid[i]||[]}; });
  pairs.sort(function(a,b){ return ttSlotRank(a.sn)-ttSlotRank(b.sn); });
  slots2=pairs.map(function(p){ return p.sn; });
  var rows=pairs.map(function(p){ return p.row; });

  var cells2={};
  slots2.forEach(function(sn,si){
    var row=rows[si]||[];
    days2.forEach(function(dn,di){
      var v=String(row[di]==null?'':row[di]).replace(/\s+/g,' ').trim();
      if(!v||!ttParseCell(v)) return;
      cells2[di+'|'+si]=v;
    });
  });
  return {days:days2,slots:slots2,cells:cells2};
}

/* ---- 上传 / 识别 ---- */
var TT_CAL=null, TT_LAST_IMG='', TT_THUMB='', TT_FILE=null;

function ttFileInput(){
  if(TT_FILE) return TT_FILE;
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    inp.value='';
    if(f) ttHandleFile(f);
  };
  document.body.appendChild(inp);
  TT_FILE=inp;
  return inp;
}

function ttHandleFile(file){
  if(!file.type || file.type.indexOf('image/')!==0){ toast('请选择图片文件'); return; }
  toast('正在压缩照片…');
  ttShrink(file,1600,0.86,function(big){
    if(!big){ toast('照片读取失败，可换一张或手动填写'); return; }
    TT_LAST_IMG=big.url;
    TT_THUMB='';
    ttCalibOpen({
      img:big.url,
      days:['周一','周二','周三','周四','周五'],
      slots:['早自习','第1节','第2节','第3节','第4节','第5节','第6节','第7节','第8节'],
      cells:{},
      status:'AI 正在识别课表结构，约 10~20 秒…'
    });
    ttShrink(file,720,0.6,function(sm){ TT_THUMB=sm?sm.url:''; });
    ttRunOcr(big.url);
  });
}

function ttRunOcr(url){
  if(!window.fetch){
    if(TT_CAL){ TT_CAL.status='当前浏览器不支持联网识别，请对照左图手工填写'; ttCalibRender(); }
    return;
  }
  ttAiParse(url).then(function(j){
    var r=ttNormalizeParsed(j);
    if(!TT_CAL) return;
    TT_CAL.days=r.days; TT_CAL.slots=r.slots; TT_CAL.cells=r.cells;
    var n=Object.keys(r.cells).length;
    TT_CAL.status='AI 已识别 '+n+' 个有课格子（'+r.days.length+' 天 × '+r.slots.length+' 个时段），请对照左图校对';
    ttCalibRender();
    if(!n) toast('没识别到内容，可对照左图手工填写');
  }).catch(function(e){
    if(!TT_CAL) return;
    TT_CAL.status='识别失败（'+((e&&e.message)||'网络异常')+'），可对照左图手工填写，或点「重新识别」';
    ttCalibRender();
  });
}

/* ---- 校对层 ---- */
function ttCalibOpen(o){
  TT_CAL={img:o.img||'',days:o.days.slice(),slots:o.slots.slice(),
          cells:o.cells||{},status:o.status||''};
  var el=document.getElementById('ttcalib');
  if(!el){
    el=document.createElement('div');
    el.id='ttcalib'; el.className='calib';
    document.body.appendChild(el);
  }
  el.classList.add('on');
  ttCalibRender();
}
function ttCalibClose(){
  TT_CAL=null;
  var el=document.getElementById('ttcalib');
  if(el){ el.classList.remove('on'); el.innerHTML=''; }
}
function ttCalibCount(){
  if(!TT_CAL) return 0;
  var n=0;
  Object.keys(TT_CAL.cells).forEach(function(k){ if(String(TT_CAL.cells[k]||'').trim()) n++; });
  return n;
}
function ttCalibRender(){
  var el=document.getElementById('ttcalib');
  if(!el||!TT_CAL) return;
  var c=TT_CAL, i, j;
  var h='<div class="cbox">';
  h+='<div class="cbar"><h3>校对课表</h3><span class="st" id="calSt">'+esc(c.status)+'</span><span class="sp"></span>'+
     '<button class="ttbtn" data-cal="readd">重新识别</button>'+
     '<button class="ttbtn" data-cal="clear">全部清空</button>'+
     '<button class="ttbtn" data-cal="cancel">取消</button>'+
     '<button class="ttbtn pri" data-cal="save">保存课表</button></div>';
  h+='<div class="cmain">';
  if(c.img){
    h+='<div class="cimg"><img id="calImg" src="'+c.img+'" alt="课表原图"></div>';
  }
  h+='<div class="cgrid"><div class="tt2" style="grid-template-columns:74px repeat('+c.days.length+',minmax(72px,1fr))">';
  // 表头行
  h+='<div class="hh" style="padding:0"><button class="cx" data-cal="addday" title="加一列">＋</button></div>';
  c.days.forEach(function(d,i){
    h+='<div class="chd"><input class="cin hd" data-calhday="'+i+'" value="'+esc(d)+'">'+
       '<button class="cx" data-caldelday="'+i+'" title="删掉这一天">×</button></div>';
  });
  // 表体
  c.slots.forEach(function(s,i){
    h+='<div class="chd"><input class="cin hd" data-calhslot="'+i+'" value="'+esc(s)+'">'+
       '<button class="cx" data-caldelslot="'+i+'" title="删掉这个时段">×</button></div>';
    c.days.forEach(function(d,j){
      var v=c.cells[j+'|'+i]||'';
      h+='<div class="cellw"><input class="cin'+(v?' ai':'')+'" data-calc="'+j+'|'+i+'" value="'+esc(v)+'" placeholder="空"></div>';
    });
  });
  h+='</div>';
  h+='<div class="ttnote">黄底为识别结果，点进去直接改；留空＝这节课没安排。'+
     '<a data-cal="addslot">＋ 加一个时段</a></div>';
  h+='</div></div>';
  h+='<div class="cfoot"><span class="st" id="calCnt">共 '+ttCalibCount()+' 个有课格子 · 照片只留缩略图存档</span>'+
     '<span class="sp"></span>'+
     '<button class="ttbtn" data-cal="cancel">取消</button>'+
     '<button class="ttbtn pri" data-cal="save">保存课表</button></div>';
  h+='</div>';
  el.innerHTML=h;
  ttCalibBind(el);
}

function ttCalibBind(el){
  var c=TT_CAL;
  // 格子输入（不重绘，避免丢焦点）
  el.querySelectorAll('[data-calc]').forEach(function(inp){
    inp.addEventListener('input',function(){
      var k=inp.getAttribute('data-calc'), v=inp.value;
      if(String(v||'').trim()) { c.cells[k]=v; inp.classList.add('ai'); }
      else { delete c.cells[k]; inp.classList.remove('ai'); }
      var cnt=el.querySelector('#calCnt');
      if(cnt) cnt.textContent='共 '+ttCalibCount()+' 个有课格子 · 照片只留缩略图存档';
    });
    inp.addEventListener('focus',function(){ inp.select(); });
  });
  // 表头重命名
  el.querySelectorAll('[data-calhday]').forEach(function(inp){
    inp.addEventListener('change',function(){
      c.days[+inp.getAttribute('data-calhday')]=inp.value.trim();
    });
  });
  el.querySelectorAll('[data-calhslot]').forEach(function(inp){
    inp.addEventListener('change',function(){
      c.slots[+inp.getAttribute('data-calhslot')]=inp.value.trim();
    });
  });
  // 按钮
  el.querySelectorAll('[data-cal]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var a=btn.getAttribute('data-cal');
      if(a==='cancel'){ ttCalibClose(); return; }
      if(a==='save'){ ttCalibSave(); return; }
      if(a==='clear'){
        if(!confirm('清空所有已填格子？')) return;
        c.cells={}; ttCalibRender(); return;
      }
      if(a==='addday'){
        c.days.push('新加一天'); ttCalibRender(); return;
      }
      if(a==='addslot'){
        c.slots.push('新增时段');
        c.slots=ttSortSlots(c.slots); ttCalibRender(); return;
      }
      if(a==='readd'){
        if(!TT_LAST_IMG){ toast('没有可重试的照片，请重新上传'); return; }
        c.status='重新识别中，约 10~20 秒…'; ttCalibRender(); ttRunOcr(TT_LAST_IMG); return;
      }
    });
  });
  // 删一行 / 删一列（按索引平移，保住其它格子）
  el.querySelectorAll('[data-caldelday]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var di=+btn.getAttribute('data-caldelday');
      if(c.days.length<=1){ toast('至少保留一天'); return; }
      var nc={};
      Object.keys(c.cells).forEach(function(k){
        var p=k.split('|'), d=+p[0], s=+p[1];
        if(d===di) return;
        nc[(d>di?d-1:d)+'|'+s]=c.cells[k];
      });
      c.cells=nc; c.days.splice(di,1); ttCalibRender();
    });
  });
  el.querySelectorAll('[data-caldelslot]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var si=+btn.getAttribute('data-caldelslot');
      if(c.slots.length<=1){ toast('至少保留一个时段'); return; }
      var nc={};
      Object.keys(c.cells).forEach(function(k){
        var p=k.split('|'), d=+p[0], s=+p[1];
        if(s===si) return;
        nc[d+'|'+(s>si?s-1:s)]=c.cells[k];
      });
      c.cells=nc; c.slots.splice(si,1); ttCalibRender();
    });
  });
  // 图放大
  var img=el.querySelector('#calImg');
  if(img) img.addEventListener('click',function(){ img.classList.toggle('zoom'); });
}

function ttCalibSave(){
  var c=TT_CAL; if(!c) return;
  var days=c.days.map(function(n,i){ return String(n||'').trim()||('第'+(i+1)+'天'); });
  var slots=c.slots.map(function(n,i){ return String(n||'').trim()||('第'+(i+1)+'节'); });
  var cells={}, n=0, bad=0;
  Object.keys(c.cells).forEach(function(k){
    var raw=String(c.cells[k]||'').replace(/\s+/g,' ').trim();
    if(!raw) return;
    var p=k.split('|'), di=+p[0], si=+p[1];
    if(isNaN(di)||isNaN(si)||days[di]===undefined||slots[si]===undefined) return;
    var o=ttParseCell(raw);
    if(!o){ bad++; return; }
    cells[di+'|'+si]=o; n++;
  });
  if(!n && !confirm('课表还是空的，仍要保存吗？')) return;
  var oldMeta=(DB.tt&&DB.tt.meta)||{};
  DB.tt={days:days,slots:slots,cells:cells,
    meta:{src:(c.img?'ocr':'manual'),at:Date.now(),img:(TT_THUMB||oldMeta.img||'')}};
  save();
  ttCalibClose(); TT_LAST_IMG=''; TT_THUMB='';
  renderMenu(); renderHeader(); renderPage();
  toast('课表已保存：'+n+' 个有课格子'+(bad?('，'+bad+' 格认不出科目'):''));
}

function ttEditExisting(){
  var t=normalizeTT(), cells={};
  Object.keys(t.cells).forEach(function(k){
    var c=t.cells[k];
    if(!c||!c.n) return;
    cells[k]=c.raw || [c.n,c.c,c.room].filter(Boolean).join(' ');
  });
  TT_LAST_IMG='';
  ttCalibOpen({
    img:(t.meta&&t.meta.img)||'',
    days:t.days.slice(), slots:t.slots.slice(), cells:cells,
    status:'手动模式：直接改格子，改完点保存'
  });
}

function pageTT(){
  var t=normalizeTT();
  var colorMap={语文:'#eef3ff|#2a56d4',数学:'#f3efff|#6a4ce0',英语:'#e9f8f2|#0b8a63',
    物理:'#fff4e8|#b57a12',化学:'#fdeeee|#c9433c',生物:'#e8f7f9|#177e8a',
    政治:'#fff6e6|#a9772a',历史:'#fdf2e3|#8a5a1a',地理:'#eaf4ec|#2f7a45',
    体育:'#f0f4ff|#3b6ef5',自习:'#f4f6fb|#7b8899',班会:'#fdf0f7|#a4406f'};
  var pal=['#eef3ff|#2a56d4','#f3efff|#6a4ce0','#e9f8f2|#0b8a63','#fff4e8|#b57a12',
           '#fdeeee|#c9433c','#e8f7f9|#177e8a','#fff6e6|#a9772a','#fdf0f7|#a4406f'];
  var pi=0;
  function colorOf(n){
    if(!colorMap[n]){ colorMap[n]=pal[pi++%pal.length]; }
    return colorMap[n].split('|');
  }
  var total=0, sub={}, cls={};
  Object.keys(t.cells).forEach(function(k){
    var c=t.cells[k];
    if(!c||!c.n) return;
    total++; sub[c.n]=(sub[c.n]||0)+1;
    if(c.c) cls[c.c]=(cls[c.c]||0)+1;
  });
  var srcTag = (t.meta&&t.meta.src==='ocr') ? '照片识别导入'
             : (t.meta&&t.meta.src==='seed') ? '示例数据' : '手动维护';
  var when = (t.meta&&t.meta.at) ? new Date(t.meta.at) : null;

  var h='<div class="card"><div class="ch"><h3>我的课表</h3><span class="tag">'+srcTag+'</span>'+
        '<span class="rt">共 '+total+' 节 · '+t.days.length+' 天 × '+t.slots.length+' 个时段</span></div>';
  h+='<div class="ttbar">'+
     '<button class="ttbtn pri" data-ttup>📷 拍照 / 上传课表</button>'+
     '<button class="ttbtn" data-ttedit>✏️ 手动编辑网格</button>'+
     '<span class="grow">上传课表照片后自动识别星期和节次，重排成下面这张表；识别结果可以对照原图逐格校对，不用一格格敲。</span>'+
     '</div>';
  h+='<div class="ttscroll"><div class="tt2" style="grid-template-columns:58px repeat('+t.days.length+',minmax(86px,1fr))">';
  h+='<div class="hh"></div>';
  t.days.forEach(function(d){ h+='<div class="hh">'+esc(d)+'</div>'; });
  t.slots.forEach(function(s,si){
    h+='<div class="slot">'+esc(s)+'</div>';
    t.days.forEach(function(d,di){
      var c=t.cells[di+'|'+si];
      if(!c||!c.n){ h+='<div class="cls empty" data-tt="'+di+'|'+si+'"><b>—</b></div>'; return; }
      var col=colorOf(c.n), sm=[];
      if(c.c) sm.push(c.c);
      if(c.room) sm.push(c.room);
      if(c.r) sm.push(c.r);
      h+='<div class="cls" data-tt="'+di+'|'+si+'" style="background:'+col[0]+';border-color:'+col[0]+'">'+
         '<b style="color:'+col[1]+'">'+esc(c.n)+'</b><span>'+esc(sm.join(' · '))+'</span></div>';
    });
  });
  h+='</div></div>';
  if(t.meta&&t.meta.img){
    h+='<div class="ttthumb"><img id="ttThumb" src="'+t.meta.img+'" alt="课表原图">'+
       '<span>原图留档'+(when?(' · '+(when.getMonth()+1)+'月'+when.getDate()+'日导入'):'')+'</span></div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="ch"><h3>课时统计</h3><span class="rt">按科目</span></div><div class="lib">';
  var ks=Object.keys(sub).sort(function(a,b){ return sub[b]-sub[a]; });
  if(!ks.length) h+='<div class="empty">还没有课表数据，点上面的「拍照 / 上传课表」导入</div>';
  ks.forEach(function(k){ h+='<div class="kv">'+esc(k)+' <b>'+sub[k]+' 节</b></div>'; });
  h+='</div>';
  var kc=Object.keys(cls).sort(function(a,b){ return cls[b]-cls[a]; });
  if(kc.length){
    h+='<div class="ch" style="margin-top:16px"><h3>教学班分布</h3></div><div class="lib">';
    kc.forEach(function(k){ h+='<div class="kv">'+esc(k)+' <b>'+cls[k]+' 节</b></div>'; });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

/* ============ 学生管理 ============ */
function pageStudents(){
  var m=state.month, t=totals(m);
  var neg={};
  DB.events.forEach(function(e){
    if(NEG_ITEMS.indexOf(e.item)>=0 && e.month===m) neg[e.sid]=(neg[e.sid]||0)+e.delta;
  });
  var list=DB.students.filter(function(s){
    if(!state.search) return true;
    return s.group===state.search;
  });
  var rows=list.map(function(s){
    return {no:s.no,n:'<b>'+esc(s.name)+'</b>',g:'<span class="gname">'+s.group+'</span>',

      op:'<button class="btn ghost sm" data-edit="students:'+s.id+'">编辑</button> '+
         '<button class="btn ghost sm" data-srec="'+s.id+'">录积分</button> '+
         '<button class="btn ghost sm" data-stalk="'+s.id+'">谈话</button>'};
  });
  var h='<div class="card"><div class="ch"><h3>学生名单</h3><span class="tag">'+list.length+' 人</span>'+
        '<span class="rt"><button class="btn ghost sm" data-edit="students:">＋ 新增学生</button></span></div>';

      fmt:function(r){return r.neg?'<span class="badge">'+r.neg+'</span>':'<span class="muted">0</span>'}},
    {k:'op',label:'操作',num:true}],rows);

}

/* ============ 成绩分析 ============ */
function pageScores(){
  var ex=DB.exams.filter(function(x){return x.id===state.exam})[0];
  if(!ex) return '<div class="empty">请选择考试</div>';
  var hasData=Object.keys(ex.data||{}).length>0;

  if(state.scoreTab==='录入') return scoreEntry(ex);
  if(state.scoreTab==='排名') return scoreRank(ex);
  if(state.scoreTab==='考试管理') return scoreManage(ex);

  if(!hasData){
    return '<div class="card"><div class="empty" style="padding:60px 0">'+
      '<div style="font-size:15px;color:#7b8899;margin-bottom:6px">'+ex.name+' 暂无成绩数据</div>'+
      '<div style="font-size:12.5px;color:#aab5c4;margin-bottom:16px">可以在「录入」里逐人录入，或载入一份示例成绩查看分析效果</div>'+
      '<button class="btn pri" data-demo="1">载入示例成绩</button> <button class="btn ghost" data-stab="录入">去录入</button>'+
      '</div></div>';
  }

  var si=ex.subjects.indexOf(state.subject);
  var full = si<0 ? ex.full.reduce(function(a,b){return a+b},0) : ex.full[si];
  var vals=[];
  DB.students.forEach(function(s){
    var d=ex.data[s.id]; if(!d) return;
    if(si<0){ vals.push({s:s,v:d.reduce(function(a,b){return a+b},0)}); }
    else if(typeof d[si]==='number'){ vals.push({s:s,v:d[si]}); }
  });
  if(!vals.length) return '<div class="empty">该科目暂无数据</div>';
  var sum=vals.reduce(function(a,b){return a+b.v},0);
  var avg=sum/vals.length;
  var pass=vals.filter(function(x){return x.v>=full*0.6}).length;
  var good=vals.filter(function(x){return x.v>=full*0.8}).length;
  var mx=Math.max.apply(null,vals.map(function(x){return x.v}));
  var mn=Math.min.apply(null,vals.map(function(x){return x.v}));
  var mxS=vals.filter(function(x){return x.v===mx}).map(function(x){return x.s.name}).join('、');
  var mnS=vals.filter(function(x){return x.v===mn}).map(function(x){return x.s.name}).join('、');

  var h='<div class="notice"><b>提示</b><span>当前为示例成绩数据，用于演示分析界面。正式使用请在「录入」中填写真实成绩。</span></div>';

  h+='<div class="metrics">'+
    '<div class="metric b"><div class="mlabel">平均分</div><div class="mval">'+avg.toFixed(1)+'</div><div class="msub">满分 '+full+'</div></div>'+
    '<div class="metric g"><div class="mlabel">及格率</div><div class="mval">'+(pass/vals.length*100).toFixed(0)+'<small>%</small></div><div class="msub">≥'+(full*0.6)+' 分</div></div>'+
    '<div class="metric o"><div class="mlabel">优秀率</div><div class="mval">'+(good/vals.length*100).toFixed(0)+'<small>%</small></div><div class="msub">≥'+(full*0.8)+' 分</div></div>'+
    '<div class="metric p"><div class="mlabel">最高 / 最低</div><div class="mval">'+mx+'<small> / '+mn+'</small></div><div class="msub">已录 '+vals.length+' 人</div></div>'+
    '</div>';

  var bands=[[0,full*0.6,'<'+Math.round(full*0.6)],[full*0.6,full*0.7,Math.round(full*0.6)+'-'+Math.round(full*0.7)],
    [full*0.7,full*0.8,Math.round(full*0.7)+'-'+Math.round(full*0.8)],
    [full*0.8,full*0.9,Math.round(full*0.8)+'-'+Math.round(full*0.9)],
    [full*0.9,full+1,Math.round(full*0.9)+'-'+full]];
  var bcolors=['#e3524b','#f2942a','#3b6ef5','#8b5cf6','#0eab7c'];
  var brows=bands.map(function(b,i){
    var c=vals.filter(function(x){return x.v>=b[0]&&x.v<b[1]}).length;
    return {n:b[2],v:c,c:bcolors[i]};
  });
  h+='<div class="card"><div class="ch"><h3>'+esc(state.subject)+' 分数段分布</h3><span class="tag">'+vals.length+' 人</span></div><div id="scoreChart"></div></div>';

  var subjRows=ex.subjects.map(function(sjx,i){
    var vs=DB.students.map(function(s){return (ex.data[s.id]||[])[i]}).filter(function(v){return typeof v==='number'});
    return {n:sjx,v:vs.length?+(vs.reduce(function(a,b){return a+b},0)/vs.length).toFixed(1):0,c:PALETTE[i]};
  });
  h+='<div class="card"><div class="ch"><h3>各科平均分对比</h3><span class="rt">满分 '+ex.full[0]+'</span></div><div id="subjChart"></div></div>';

  h+='<div class="card"><div class="ch"><h3>'+esc(state.subject)+' 成绩明细</h3>'+
     '<span class="rt">'+esc(mxS)+' 最高 · '+esc(mnS)+' 最低</span></div>';
  var sorted=vals.slice().sort(function(a,b){return b.v-a.v});
  h+=tbl([{k:'rk',label:'名次'},{k:'n',label:'姓名'},{k:'g',label:'小组'},
    {k:'v',label:'分数',num:true},{k:'d',label:'与班均',num:true}],
    sorted.map(function(r,i){
      var d=+(r.v-avg).toFixed(1);
      return {rk:'<span class="rk '+(i===0?'t1':i===1?'t2':i===2?'t3':'')+'">'+(i+1)+'</span>',
        n:esc(r.s.name),g:'<span class="gname">'+r.s.group+'</span>',v:'<b>'+r.v+'</b>',
        d:'<span class="'+(d>0?'up':d<0?'down':'flat')+'">'+(d>0?'+':'')+d+'</span>'};
    }));
  h+='</div>';

  afterRender.scores=function(){
    vbar($('scoreChart'),brows);
    hbar($('subjChart'),subjRows,{lw:56});
  };
  return h;
}

function scoreEntry(ex){
  var h='<div class="notice"><b>录入</b><span>填写各科分数后点保存。留空表示缺考。</span></div>';
  h+='<div class="card"><div class="ch"><h3>'+esc(ex.name)+' 成绩录入</h3>'+
     '<span class="rt"><button class="btn pri sm" data-save-scores="1">保存成绩</button></span></div>';
  h+='<table><thead><tr><th>学号</th><th>姓名</th><th>小组</th>';
  ex.subjects.forEach(function(s){ h+='<th class="num">'+esc(s)+'</th>'; });
  h+='<th class="num">总分</th></tr></thead><tbody>';
  DB.students.forEach(function(s){
    var d=ex.data[s.id]||[];
    h+='<tr><td class="num gname">'+s.no+'</td><td>'+esc(s.name)+'</td><td class="gname">'+s.group+'</td>';
    ex.subjects.forEach(function(sub,i){
      h+='<td class="num"><input type="number" data-sc="'+s.id+':'+i+'" value="'+(typeof d[i]==='number'?d[i]:'')+
         '" style="width:74px;padding:5px 8px;text-align:right"></td>';
    });
    h+='<td class="num tot" data-tot="'+s.id+'">'+(d.length?d.reduce(function(a,b){return (a||0)+(b||0)},0):'—')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function scoreRank(ex){
  if(!Object.keys(ex.data||{}).length) return '<div class="empty">暂无成绩数据，请先录入。</div>';
  var arr=DB.students.map(function(s){
    var d=ex.data[s.id];
    return {s:s,total:d?d.reduce(function(a,b){return (a||0)+(b||0)},0):null,d:d};
  }).filter(function(x){return x.total!==null}).sort(function(a,b){return b.total-a.total});
  var cols=[{k:'rk',label:'名次'},{k:'n',label:'姓名'},{k:'g',label:'小组'}];
  ex.subjects.forEach(function(s,i){ cols.push({k:'s'+i,label:s,num:true}); });
  cols.push({k:'t',label:'总分',num:true});
  var rows=arr.map(function(r,i){
    var o={rk:'<span class="rk '+(i===0?'t1':i===1?'t2':i===2?'t3':'')+'">'+(i+1)+'</span>',
      n:'<b>'+esc(r.s.name)+'</b>',g:'<span class="gname">'+r.s.group+'</span>',t:'<b>'+r.total+'</b>'};
    r.d.forEach(function(v,j){ o['s'+j]=v==null?'—':v; });
    return o;
  });
  return '<div class="card"><div class="ch"><h3>'+esc(ex.name)+' 总分排名</h3><span class="tag">'+arr.length+' 人</span></div>'+
    tbl(cols,rows)+'</div>';
}

function scoreManage(ex){
  var h='<div class="card"><div class="ch"><h3>考试列表</h3><span class="rt">共 '+DB.exams.length+' 次</span></div>';
  h+=tbl([{k:'n',label:'考试名称'},{k:'d',label:'日期'},{k:'c',label:'科目'},
    {k:'p',label:'已录人数',num:true},{k:'op',label:'',num:true}],
    DB.exams.map(function(e){
      return {n:esc(e.name),d:e.date,c:'<span class="gname">'+e.subjects.join(' / ')+'</span>',
        p:Object.keys(e.data||{}).length,
        op:'<button class="btn ghost sm" data-exam="'+e.id+'">查看</button>'};
    }));
  h+='</div>';
  h+='<div class="card"><div class="ch"><h3>新建考试</h3></div><div class="formrow">'+
    '<div class="field" style="flex:1;min-width:150px"><label>考试名称</label><input type="text" data-f="name" placeholder="如：第三次月考"></div>'+
    '<div class="field" style="width:150px"><label>日期</label><input type="date" data-f="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
    '<div class="field" style="width:170px"><label>科目（逗号分隔）</label><input type="text" data-f="subjects" value="语文,数学,英语"></div>'+
    '<button class="btn pri" data-add="exam">创建</button></div></div>';
  return h;
}

/* ============ 违纪统计 ============ */
function pageViolations(){
  var m=state.month;
  var evs=DB.events.filter(function(e){return e.month===m && NEG_ITEMS.indexOf(e.item)>=0});
  var byItem={}, byStu={};
  evs.forEach(function(e){
    byItem[e.item]=(byItem[e.item]||0)+e.delta;
    byStu[e.sid]=(byStu[e.sid]||0)+e.delta;
  });
  var total=evs.reduce(function(a,b){return a+b.delta},0);
  var ppl=Object.keys(byStu).length;
  var h='<div class="metrics">'+
    '<div class="metric r"><div class="mlabel">'+MLABEL[m]+'扣分合计</div><div class="mval">'+total+'</div><div class="msub">'+evs.length+' 条记录</div></div>'+
    '<div class="metric o"><div class="mlabel">涉及学生</div><div class="mval">'+ppl+'<small> 人</small></div><div class="msub">占全班 '+(ppl/DB.students.length*100).toFixed(0)+'%</div></div>'+
    '<div class="metric b"><div class="mlabel">人均扣分</div><div class="mval">'+Math.abs(total/DB.students.length).toFixed(1)+'</div><div class="msub">含未违纪学生</div></div>'+
    '<div class="metric p"><div class="mlabel">项目种类</div><div class="mval">'+Object.keys(byItem).length+'<small> 类</small></div><div class="msub">违纪 · 抽查 · 问题项</div></div>'+
    '</div>';

  if(!evs.length){
    h+='<div class="card"><div class="empty">'+MLABEL[m]+'没有扣分记录，班级状态良好。</div></div>';
    return h;
  }

  h+='<div class="grid2">';
  h+='<div class="card"><div class="ch"><h3>扣分项目构成</h3></div><div id="vioItem"></div></div>';
  h+='<div class="card"><div class="ch"><h3>扣分最多的学生</h3><span class="rt">Top 8</span></div><div id="vioStu"></div></div>';
  h+='</div>';

  h+='<div class="card"><div class="ch"><h3>违纪明细</h3><span class="tag">'+evs.length+' 条</span></div>';
  h+=tbl([{k:'date',label:'日期',cls:'gname'},{k:'n',label:'姓名'},{k:'item',label:'项目'},
    {k:'d',label:'扣分',num:true}],
    evs.sort(function(a,b){return b.ts-a.ts}).slice(0,80).map(function(e){
      return {date:e.date,n:esc(sname(e.sid)),item:iname(e.item),
        d:'<span style="color:#e3524b;font-weight:600">'+e.delta+'</span>'};
    }));
  h+='</div>';

  afterRender.violations=function(){
    var rows=Object.keys(byItem).map(function(k,i){
      return {n:iname(k),v:Math.abs(byItem[k]),c:['#e3524b','#f2942a','#8b5cf6','#3b6ef5'][i%4]};
    }).sort(function(a,b){return b.v-a.v});
    hbar($('vioItem'),rows,{lw:78});
    var srows=Object.keys(byStu).map(function(k){
      return {n:sname(k),v:Math.abs(byStu[k]),c:'#e3524b'};
    }).sort(function(a,b){return b.v-a.v}).slice(0,8);
    hbar($('vioStu'),srows,{lw:62});
  };
  return h;
}

/* ============ 排座位 ============ */
function pageSeats(){
  if(!DB.seats.order){
    DB.seats.order={};
    GROUPS.forEach(function(g){
      DB.seats.order[g]=DB.students.filter(function(s){return s.group===g}).map(function(s){return s.id});
    });
  }
  var h='<div class="card"><div class="ch"><h3>座位表</h3><span class="tag">点击两个学生交换位置</span>'+
    '<span class="rt"><button class="btn ghost sm" data-seat="rand">随机重排</button>'+
    '<button class="btn ghost sm" data-seat="score">按积分排</button>'+
    '<button class="btn ghost sm" data-seat="reset">按组还原</button></span></div>';
  h+='<div class="seatwrap">';
  GROUPS.forEach(function(g){
    h+='<div class="seatcol"><h4>'+g+'</h4>';
    var ids=DB.seats.order[g]||[];
    ids.forEach(function(id){
      var s=studentOf(id); if(!s) return;
      h+='<div class="seat'+(state.seatSel===id?' sel':'')+'" data-seatid="'+id+'">'+esc(s.name)+'</div>';
    });
    h+='</div>';
  });
  h+='</div></div>';
  h+='<div class="hint">座位数据仅用于排座参考，不影响积分。点击「按积分排」会按本月积分从高到低重排各列。</div>';
  return h;
}

<script>
/* ============ 通用列表模块 ============ */
function stuOptions(){

}
function listModule(o){

      h+='<select data-f="'+f.k+'">'+f.options.map(function(op){
        return '<option value="'+esc(op)+'">'+esc(op)+'</option>';
      }).join('')+'</select>';
    }else if(f.type==='stu'){
      h+='<select data-f="'+f.k+'">'+DB.students.map(function(s){
        return '<option value="'+s.id+'">'+s.name+'（'+s.group+'）</option>';
      }).join('')+'</select>';
    }else if(f.type==='textarea'){
      h+='<textarea data-f="'+f.k+'" placeholder="'+(f.ph||'')+'"></textarea>';
    }else{
      h+='<input type="'+(f.type||'text')+'" data-f="'+f.k+'" placeholder="'+(f.ph||'')+'" value="'+(f.def||'')+'">';
    }
    h+='</div>';
  });
